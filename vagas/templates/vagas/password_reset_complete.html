{% extends 'vagas/base.html' %}

{% block title %}
    Senha alterada
{% endblock %}

{% block content %}

<div class="recuperar-senha">

    <div class="recuperar-senha-card">

        <div class="recuperar-senha-icone">
            ✅
        </div>

        <span class="recuperar-senha-label">
            RECUPERAÇÃO DE ACESSO
        </span>

        <h1>
            Senha alterada!
        </h1>

        <p>
            Sua senha foi redefinida com sucesso.
            Agora você já pode entrar na sua conta.
        </p>

        <a
            href="{% url 'entrar_aluno' %}"
            class="botao"
        >
            Entrar na minha conta
        </a>

    </div>

</div>

{% endblock %}
