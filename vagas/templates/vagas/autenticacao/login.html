<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar - Plataforma de Estágios</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family: Arial, Helvetica, sans-serif;

            background: #f4f6f8;

            color: #1f2937;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }


        /* =========================
           CONTAINER
           ========================= */

        .login-container {

            width: 100%;
            max-width: 420px;

            background: white;

            padding: 40px;

            border-radius: 14px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.10);
        }


        /* =========================
           CABEÇALHO
           ========================= */

        .cabecalho {

            text-align: center;

            margin-bottom: 30px;
        }


        .cabecalho h1 {

            margin: 0;

            color: #1f4e79;

            font-size: 27px;
        }


        .cabecalho p {

            margin-top: 8px;

            color: #6b7280;

            font-size: 15px;
        }


        /* =========================
           TÍTULO
           ========================= */

        .login-container h2 {

            margin-bottom: 25px;

            text-align: center;

            font-size: 22px;

            color: #374151;
        }


        /* =========================
           MENSAGEM DE ERRO
           ========================= */

        .mensagem {

            background: #fee2e2;

            color: #991b1b;

            border: 1px solid #fecaca;

            padding: 12px 15px;

            border-radius: 8px;

            margin-bottom: 20px;

            font-size: 14px;

            text-align: center;

            font-weight: bold;
        }


        /* =========================
           CAMPOS
           ========================= */

        .campo {

            margin-bottom: 20px;
        }


        .campo label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #374151;

            font-size: 14px;
        }


        .campo input {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            font-size: 15px;

            outline: none;

            transition: 0.2s;
        }


        .campo input:focus {

            border-color: #1f4e79;

            box-shadow: 0 0 0 3px rgba(31, 78, 121, 0.10);
        }


        /* =========================
           BOTÃO
           ========================= */

        .botao {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #1f4e79;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;

            transition: 0.2s;
        }


        .botao:hover {

            background: #163a5c;
        }


        /* =========================
           VOLTAR
           ========================= */

        .voltar {

            display: block;

            text-align: center;

            margin-top: 25px;

            color: #1f4e79;

            text-decoration: none;

            font-weight: bold;

            font-size: 14px;
        }


        .voltar:hover {

            text-decoration: underline;
        }


        /* =========================
           RESPONSIVIDADE
           ========================= */

        @media (max-width: 500px) {

            .login-container {

                padding: 30px 22px;
            }

            .cabecalho h1 {

                font-size: 24px;
            }

        }

    </style>

</head>


<body>


    <div class="login-container">


        <!-- =========================
             CABEÇALHO
             ========================= -->

        <div class="cabecalho">

            <h1>
                Plataforma de Estágios
            </h1>

            <p>
                Acesse sua conta para continuar
            </p>

        </div>


        <!-- =========================
             LOGIN
             ========================= -->

        <h2>
            Entrar
        </h2>


        {% if mensagem %}

            <div class="mensagem">

                {{ mensagem }}

            </div>

        {% endif %}


        <form method="post">

            {% csrf_token %}


            <div class="campo">

                <label for="username">
                    Usuário
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Digite seu usuário"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="campo">

                <label for="password">
                    Senha
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="botao"
            >
                Entrar
            </button>

        </form>


        <a
            href="/"
            class="voltar"
        >
            ← Voltar para o início
        </a>


    </div>


</body>

</html>
