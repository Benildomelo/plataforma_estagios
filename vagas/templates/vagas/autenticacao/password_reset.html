{% extends 'vagas/base.html' %}

{% block title %}
    Recuperar senha
{% endblock %}

{% block content %}

<div class="recuperar-senha">

    <div class="recuperar-senha-card">

        <div class="recuperar-senha-icone">
            🔐
        </div>

        <span class="recuperar-senha-label">
            RECUPERAÇÃO DE ACESSO
        </span>

        <h1>
            Esqueceu sua senha?
        </h1>

        <p>
            Digite o e-mail cadastrado na plataforma.
            Enviaremos instruções para você criar uma nova senha.
        </p>

        <form method="POST">
            {% csrf_token %}

            <div class="campo-perfil">
                <label for="id_email">
                    E-mail
                </label>

                <input
                    type="email"
                    name="email"
                    id="id_email"
                    placeholder="seuemail@email.com"
                    autocomplete="email"
                    required
                >
            </div>

            <button
                type="submit"
                class="botao"
            >
                📧 Enviar instruções
            </button>
        </form>

        <a
            href="{% url 'entrar_aluno' %}"
            class="voltar-login"
        >
            ← Voltar para o login
        </a>

    </div>

</div>

{% endblock %}
