<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar - Plataforma de Estágios</title>
</head>

<body>

    <h1>Plataforma de Estágios</h1>

    <h2>Entrar</h2>

    {% if mensagem %}
        <p>{{ mensagem }}</p>
    {% endif %}

    <form method="post">

        {% csrf_token %}

        <label for="username">Usuário:</label>
        <input
            type="text"
            id="username"
            name="username"
            required
        >

        <br><br>

        <label for="password">Senha:</label>
        <input
            type="password"
            id="password"
            name="password"
            required
        >

        <br><br>

        <button type="submit">
            Entrar
        </button>

    </form>

    <br>

    <a href="/">Voltar para o início</a>

</body>

</html>
