<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Vaga</title>
</head>
<body>

    <h1>Cadastrar nova vaga</h1>

    <p>Empresa: {{ empresa.nome_fantasia }}</p>

    <form method="post">
        {% csrf_token %}

        <p>
            <label>Título da vaga:</label><br>
            <input type="text" name="titulo" required>
        </p>

        <p>
            <label>Descrição:</label><br>
            <textarea name="descricao" rows="6" required></textarea>
        </p>

        <p>
            <label>Requisitos:</label><br>
            <textarea name="requisitos" rows="5"></textarea>
        </p>

        <p>
            <label>Bolsa (R$):</label><br>
            <input type="number" name="bolsa" step="0.01">
        </p>

        <p>
            <label>Carga horária:</label><br>
            <input type="text" name="carga_horaria" placeholder="Ex.: 30 horas semanais" required>
        </p>

        <p>
            <label>Local:</label><br>
            <input type="text" name="local" required>
        </p>

        <p>
            <label>Curso:</label><br>
            <select name="curso" required>
                <option value="">Selecione o curso</option>

                {% for curso in cursos %}
                    <option value="{{ curso.id }}">
                        {{ curso.nome }}
                    </option>
                {% endfor %}
            </select>
        </p>

        <button type="submit">Cadastrar vaga</button>
    </form>

    <br>

    <a href="{% url 'area_empresa' %}">
        Voltar para área da empresa
    </a>

</body>
</html>
