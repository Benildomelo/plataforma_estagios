<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastrar Vaga - Plataforma de Estágios</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
            line-height: 1.6;
        }

        header {
            background: #1f4e79;
            color: white;
            padding: 20px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            flex-wrap: wrap;
            gap: 15px;
        }

        header h1 {
            font-size: 24px;
        }

        nav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 9px 14px;
            border-radius: 6px;
        }

        nav a:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        main {
            max-width: 850px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .formulario {
            background: white;
            padding: 35px;
            border-radius: 16px;

            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.08);
        }

        .titulo {
            color: #1f4e79;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .empresa {
            color: #6b7280;
            margin-bottom: 30px;
        }

        .campo {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
            color: #374151;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;

            border: 1px solid #d1d5db;
            border-radius: 7px;

            font-size: 15px;
            font-family: Arial, sans-serif;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #1f4e79;
            box-shadow: 0 0 0 2px rgba(31, 78, 121, 0.1);
        }

        textarea {
            resize: vertical;
        }

        .botao {
            background: #1f4e79;
            color: white;

            border: none;
            padding: 13px 25px;

            border-radius: 7px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .botao:hover {
            background: #163a5c;
        }

        .voltar {
            display: inline-block;
            margin-top: 25px;

            color: #1f4e79;
            text-decoration: none;
            font-weight: bold;
        }

        .voltar:hover {
            text-decoration: underline;
        }

        @media (max-width: 700px) {

            header {
                padding: 20px;
            }

            header h1 {
                font-size: 20px;
            }

            main {
                margin: 25px auto;
            }

            .formulario {
                padding: 25px 20px;
            }

            .titulo {
                font-size: 26px;
            }

        .mensagem {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        }    
    
    </style>
</head>

<body>

    <header>

        <h1>Plataforma de Estágios</h1>

        <nav>

            <a href="/">
                Início
            </a>

            <a href="{% url 'area_empresa' %}">
                Minha área
            </a>

            <a href="{% url 'sair' %}">
                Sair
            </a>

        </nav>

    </header>


    <main>

        <section class="formulario">

            <h2 class="titulo">
                Cadastrar nova vaga
            </h2>

            <p class="empresa">
                Empresa: <strong>{{ empresa.nome_fantasia }}</strong>
            </p>

            {% if mensagem %}
                <div class="mensagem">
                    {{ mensagem }}
                </div>
            {% endif %}

            <form method="post">

                {% csrf_token %}


                <div class="campo">

                    <label for="titulo">
                        Título da vaga
                    </label>

                    <input
                        type="text"
                        id="titulo"
                        name="titulo"
                        placeholder="Ex.: Estagiário de Desenvolvimento"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="descricao">
                        Descrição da vaga
                    </label>

                    <textarea
                        id="descricao"
                        name="descricao"
                        rows="7"
                        placeholder="Descreva as atividades que serão realizadas..."
                        required
                    ></textarea>

                </div>


                <div class="campo">

                    <label for="requisitos">
                        Requisitos
                    </label>

                    <textarea
                        id="requisitos"
                        name="requisitos"
                        rows="5"
                        placeholder="Informe os conhecimentos e requisitos necessários..."
                    ></textarea>

                </div>


                <div class="campo">

                    <label for="bolsa">
                        Bolsa (R$)
                    </label>

                    <input
                        type="number"
                        id="bolsa"
                        name="bolsa"
                        step="0.01"
                        min="0"
                        placeholder="Ex.: 1200.00"
                    >

                </div>


                <div class="campo">

                    <label for="carga_horaria">
                        Carga horária
                    </label>

                    <input
                        type="text"
                        id="carga_horaria"
                        name="carga_horaria"
                        placeholder="Ex.: 30 horas semanais"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="local">
                        Local
                    </label>

                    <input
                        type="text"
                        id="local"
                        name="local"
                        placeholder="Ex.: Fortaleza - CE"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="curso">
                        Curso
                    </label>

                    <select
                        id="curso"
                        name="curso"
                        required
                    >

                        <option value="">
                            Selecione o curso
                        </option>

                        {% for curso in cursos %}

                            <option value="{{ curso.id }}">
                                {{ curso.nome }}
                            </option>

                        {% endfor %}

                    </select>

                </div>


                <button
                    class="botao"
                    type="submit"
                >
                    Cadastrar vaga
                </button>

            </form>


            <a
                class="voltar"
                href="{% url 'area_empresa' %}"
            >
                ← Voltar para área da empresa
            </a>

        </section>

    </main>

</body>

</html>
